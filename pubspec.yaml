name: drivebook
description: Daily Income & Expense Tracker for Drivers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1

  # Local persistence (Phase 1)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.4
  path: ^1.9.0
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  path_provider_platform_interface: any
  plugin_platform_interface: any

flutter:
  uses-material-design: true

  assets:
    - assets/images/
